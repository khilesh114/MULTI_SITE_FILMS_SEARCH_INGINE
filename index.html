<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MULTI SITE FILMS HACKER ENGINE</title>
<meta name="theme-color" content="#121212" />
<style>
  :root {
    --green: #00ff90;
    --neon: #00ffe7;
    --back: #111418;
    --high: #15ff80;
    --white: #fff;
  }
  body {
    font-family: 'Fira Mono', 'Roboto Mono', monospace;
    background: linear-gradient(120deg, #111418 0%, #191621 100%);
    color: var(--green);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #main-panel {
    box-shadow: 0 0 30px 10px #011a0e80;
    padding: 38px 25px 28px 25px;
    border-radius: 18px;
    background: rgba(10,16,14,0.96);
    z-index: 1;
    position: relative;
    min-width: 310px;
    width: 96vw;
    max-width: 460px;
  }
  #warningMessage {
    color: #ff5555;
    background: #33000088;
    border: 2px solid #ff5555;
    padding: 10px;
    border-radius: 7px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: bold;
  }
  h1 {
    text-align: center;
    text-transform: uppercase;
    font-size: 2.1em;
    letter-spacing: 3px;
    text-shadow: 0 0 14px var(--high), 0 0 45px var(--neon);
    margin-bottom: 24px;
  }
  .input-group {
    text-align: center;
    margin-bottom: 17px;
    position: relative;
    z-index: 7;
  }
  input[type="text"] {
    width: 95%;
    border: 2px solid var(--high);
    border-radius: 5px;
    background: #0d1818;
    color: var(--green);
    padding: 13px 13px;
    font-size: 1.08em;
    box-shadow: 0 0 7px #00ff9082;
    outline: none;
    margin-bottom: 11px;
    position: relative;
    z-index: 5;
  }
  input[type="text"]:focus { border-color: var(--neon); }
  .suggestions {
    position: absolute;
    left: 2.5%;
    top: 54px;
    width: 95%;
    background: #121b21;
    border: 1.2px solid #0df6;
    border-top: none;
    border-radius: 0 0 6px 6px;
    max-height: 170px;
    overflow-y: auto;
    z-index: 9;
    box-shadow: 0 4px 22px #00ffb810;
    display: none;
  }
  .suggestions .sugg {
    padding: 8px 13px;
    cursor: pointer;
    color: #0ae288;
    font-size: 1em;
    background: none;
    border: none;
    text-align: left;
    width: 100%;
    outline: none;
    transition: background 0.14s, color 0.14s;
  }
  .suggestions .sugg:hover, .suggestions .sugg.active {
    background: #122d28;
    color: #33ffe6;
  }
  .button-group {
    display: flex;
    flex-direction: column;
    gap: 9px;
    width: 100%;
  }
  button, select {
    background: linear-gradient(90deg, #0d212b 50%, #113820 100%);
    color: var(--green);
    border: 2px solid var(--neon);
    border-radius: 7px;
    font-size: 1em;
    padding: 10px 7px;
    cursor: pointer;
    box-shadow: 0 0 7px #00ffbc40;
    font-family: inherit;
    transition: 0.19s;
    width: 100%;
  }
  button:hover, button:focus {
    background: #181847;
    border-color: var(--high);
    color: var(--high);
    box-shadow: 0 0 15px var(--neon);
    z-index: 1;
  }
  .theme-toggle {
    position: absolute;
    top: 17px;
    right: 22px;
    background: none;
    border: 2px solid var(--neon);
    color: var(--green);
    padding: 6px 16px;
    border-radius: 16px;
    box-shadow: 0 0 7px #00ffe769;
    cursor: pointer;
    transition: 0.2s;
    z-index: 2;
    font-size: 1.25em;
    line-height: 1;
  }
  select, .extras {
    margin-top: 8px;
    color: var(--green);
    user-select: none;
  }
  .extras {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 7px;
    font-size: 0.9em;
  }
  .extras label {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #siteCheckboxes {
    margin-top: 7px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 130px;
    overflow-y: auto;
    color: var(--green);
    font-size: 0.9em;
  }
  #siteCheckboxes label {
    cursor: pointer;
    user-select: none;
  }
  .history-matrix-container {
    position: relative;
    width: 100%;
    min-height: 45px;
    margin-top: 15px;
  }
  #historyMatrixBg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.56;
    pointer-events: none;
    border-radius: 7px;
  }
  #historyList {
    position: relative;
    font-size: 1em;
    color: #6dfff4;
    border-radius: 7px;
    padding: 10px 9px 10px 11px;
    min-height: 23px;
    z-index: 1;
    background: rgba(8, 21, 28, 0.29);
    border: 1.2px solid #24d3b8;
    word-break: break-word;
    transition: background 0.4s;
    margin-bottom: 3px;
  }
  #historyList span {
    cursor: pointer;
    user-select: none;
  }
  #historyList span:focus {
    outline: 2px solid var(--neon);
    outline-offset: 2px;
  }
  #downloadBtn {
    float: right;
    padding: 7px 14px;
    background: linear-gradient(90deg, #193, #2af196);
    color: #222;
    font-size: 0.99em;
    border: 2px solid #48fdda;
    border-radius: 8px;
    box-shadow: 0 0 11px #12fd99a8;
    font-family: inherit;
    cursor: pointer;
    transition: 0.18s;
    margin-bottom: 2px;
  }
  #downloadBtn:hover, #downloadBtn:focus {
    background: #16d1d3;
    color: #033;
    outline: none;
  }
  .clearfix::after {
    content: '';
    clear: both;
    display: table;
  }
  .background-matrix {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  ::-webkit-scrollbar {
    width: 0px;
  }
  select {
    background-color: #0d1818;
    color: var(--green);
    border-color: var(--neon);
  }
  select option {
    background-color: #111418;
    color: var(--green);
  }
  body.day-mode select {
    background-color: #ddf7de;
    color: #024d23;
    border-color: #07b957;
  }
  body.day-mode select option {
    background-color: #ddf7de;
    color: #024d23;
  }
  body.day-mode {
    background: linear-gradient(120deg, #ddeeff 0%, #c1d2e8 100%);
    color: #0a3f2c;
  }
  body.day-mode #main-panel {
    background: rgba(220, 230, 225, 0.9);
    box-shadow: 0 0 30px 10px #a3dca080;
    color: #054928;
  }
  body.day-mode input[type="text"],
  body.day-mode button,
  body.day-mode select,
  body.day-mode .suggestions {
    color: #024d23;
    border-color: #07b957;
    background: #ddf7de;
    box-shadow: 0 0 7px #07c15570;
  }
  body.day-mode .suggestions .sugg,
  body.day-mode #historyList {
    background: #a4e79b;
    color: #023910;
    border-color: #05ab4d;
  }
  body.day-mode .suggestions .sugg:hover,
  body.day-mode .suggestions .sugg.active {
    background: #089540;
    color: #d4f9d8;
  }
  body.day-mode .theme-toggle {
    border-color: #07c155;
    color: #07c155;
    box-shadow: 0 0 7px #07c155;
  }
  body.day-mode button:hover,
  body.day-mode button:focus {
    background: #0a6d2a;
    border-color: #07c155;
    color: #d4f9d8;
    box-shadow: 0 0 15px #07c155;
  }
</style>
</head>
<body>
<canvas id="matrixbg" class="background-matrix" aria-hidden="true"></canvas>
<button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle light/dark mode" aria-pressed="false">🌙</button>
<div id="main-panel" role="main">
  <div id="warningMessage">
    ⚠️ Warning: This search engine may lead to third-party sites that host copyrighted or illegal content.<br>
    Use it responsibly and at your own risk. Do not use for piracy or unlawful activity.
  </div>
  <h1>MULTI SITE FILMS<br>HACKER SEARCH ENGINE</h1>
  <div style="margin-bottom:12px; color:#18ffd2; font-size:0.9em;">
    <b>Search Only in Selected Websites:</b>
    <div id="siteCheckboxes" role="group" aria-label="Select websites to search"></div>
  </div>
  <div class="input-group">
    <input id="searchInput" type="text" placeholder="Type movie or artist name..." aria-label="Movie or Artist Name" autocomplete="off" role="searchbox" spellcheck="false" />
    <div id="suggestions" class="suggestions" role="listbox" aria-label="Search Suggestions"></div>
    <div class="extras">
      <label for="engineSel">Engine:</label>
      <select id="engineSel" aria-label="Search Engine">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duckduckgo">DuckDuckGo</option>
      </select>
      <label for="safeSearch">Safe
        <input type="checkbox" id="safeSearch" aria-label="Safe Search" checked />
      </label>
    </div>
  </div>
  <div class="button-group">
    <button type="button" onclick="searchOnSite1()">💡 Low Level Search</button>
    <button type="button" onclick="searchOnSite2()">🧬 High Level Search</button>
    <button type="button" onclick="searchOnSite3()">💀 Advanced Search</button>
    <button type="button" onclick="customSearch()">🦾 Deep Hacker Search</button>
    <button type="button" onclick="buyMeACoffee()" aria-label="Support Project">☕️ Support</button>
  </div>
  <div class="history-matrix-container" aria-live="polite" aria-atomic="true">
    <canvas id="historyMatrixBg" aria-hidden="true"></canvas>
    <div id="historyList" tabindex="0" aria-label="Recent search history"></div>
    <button id="downloadBtn" type="button" onclick="downloadHistory()" aria-label="Download search history">⬇️ Download History</button>
    <div class="clearfix"></div>
  </div>
  <div style="color:#55ffb9a8; font-size:0.88em; text-align:center; letter-spacing:1px; margin-top:7px; user-select:none;">
    made with <span style="color:#ee00cc">❤</span> by <b>Khilesh</b> • 2024
  </div>
</div>
<script>
const allSites = [
  "filmyzilla.com","filmyzilla.xyz","filmyzilla.net",
  "filmyhit.casino","couchtuner.one","1filmyfly.xyz","mydownloadtube.org",
  "hollymoviehd.cc","m4ufree.ws","bmovies.is","movies4u.li","yts.mx",
  "bolly4u.rodeo","bollyflix.beer","bolly4u.shop","downloadhub.contact",
  "9xmovies.com.vu","mkvcinemas.cat","moviemad.co.com","mp4moviez.glass",
  "worldfree4u.helpsarkari.com","filmyfly.wales","thekhatrimaza.lol","2filmywap.com"
];

function renderSiteCheckboxes() {
  const selectedSites = JSON.parse(localStorage.getItem("selectedSites") || "[]");
  const container = document.getElementById("siteCheckboxes");
  container.innerHTML = allSites.map(site => {
    const checked = selectedSites.length ? selectedSites.includes(site) : true;
    return `<label><input type="checkbox" class="siteCheck" value="${site}" ${checked ? "checked" : ""} /> ${site}</label>`;
  }).join('');
  document.querySelectorAll(".siteCheck").forEach(cb => cb.addEventListener('change', saveSelectedSites));
}

function saveSelectedSites() {
  const selected = Array.from(document.querySelectorAll('.siteCheck:checked')).map(cb => cb.value);
  localStorage.setItem("selectedSites", JSON.stringify(selected));
}

// Filtered wildcard excluding generic TLD patterns
const excludedBaseDomains = new Set(['com', 'org', 'net', 'xyz', 'in', 'co', 'info']);

function getWildcardSites() {
  const selected = JSON.parse(localStorage.getItem("selectedSites") || "[]");
  const uniqueBases = new Set();

  selected.forEach(domain => {
    let match = domain.toLowerCase().match(/^(?:[\w-]+\.)?([\w-]+)\./);
    let base = match && match[1] ? match[1] : domain.toLowerCase();
    if (!excludedBaseDomains.has(base)) {
      uniqueBases.add(base);
    }
  });
  return Array.from(uniqueBases).map(d => `site:*.${d}.*`);
}

function searchWithSelectedSites(queryModifier = null) {
  const q = searchInput.value.trim();
  if (!q) {
    alert("Type movie or artist name!");
    return;
  }
  const wildcardSites = getWildcardSites();
  if (wildcardSites.length === 0) {
    alert("Select at least one website!");
    return;
  }
  let query = `(${wildcardSites.join(" OR ")}) ${q}`;
  if (typeof queryModifier === "function") {
    query = queryModifier(q, wildcardSites);
  }
  const engine = document.getElementById("engineSel").value;
  const safe = document.getElementById("safeSearch").checked;
  addToHistory(q);
  window.open(getEngineUrl(engine, query, safe), "_blank");
}
function searchOnSite1() { searchWithSelectedSites(); }
function searchOnSite2() { searchWithSelectedSites(); }
function searchOnSite3() { searchWithSelectedSites(); }
function customSearch() {
  searchWithSelectedSites((q, sites) => {
    const orSites = sites.join(" OR ");
    return `(${orSites}) intitle:"Hindi Dubbed Movie" "${q}" OR filetype:mp4 "Hindi Dubbed Movie" "${q}" OR inurl:watch "Hindi Dubbed Movie" "${q}" OR inurl:stream "Hindi Dubbed Movie" "${q}" OR filetype:torrent "Hindi Dubbed Movie" "${q}" OR filetype:avi "Hindi Dubbed Movie" "${q}"`.replace(/\s+/g, " ").trim();
  });
}

function getEngineUrl(engine, query, safe) {
  if (engine === "google")
    return "https://www.google.com/search?q=" + encodeURIComponent(query) + (safe ? "&safe=active" : "");
  else if (engine === "bing")
    return "https://www.bing.com/search?q=" + encodeURIComponent(query) + (safe ? "&adlt=strict" : "&adlt=off");
  else if (engine === "duckduckgo")
    return "https://duckduckgo.com/?q=" + encodeURIComponent(query) + (safe ? "&kp=1" : "&kp=-2");
  return "";
}

function buyMeACoffee() {
  window.open("https://khilesh114.github.io/MULTI_SITE_FILMS_SEARCH_INGINE/", "_blank");
}

// --- Matrix and other UI scripts as before (unchanged, omitted here for brevity) ---

// Your matrix, search history, suggestion, theme toggle, etc. remain same from previous code block
// (You can use the full prior code for history, suggestions, matrix animations, theme toggle, etc.)

// Initialize on load
window.onload = () => {
  renderHistory();
  renderSiteCheckboxes();
};
</script>
</body>
</html>
